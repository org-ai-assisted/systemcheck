## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. The dist-ai systemcheck scenario harness runs the real
## check_*.bsh fragments, several of which sanitize untrusted output with the
## bare `sanitize-string` helper-scripts tool (check_dpkg, check_hostname,
## check_operating_system, ...); helper-scripts: true checks that repo out so
## the tool resolves in the CI container. The default apt stack (python3
## python3-pytest python3-hypothesis) already covers the rest.
##
## bubblewrap: the scenario harness's run_check_scenario_isolated (and the
## log-checker config/temp-dir regression tests) neutralize absolute-path guards
## (Qubes marker-vm, the fixed /var/cache temp dir) with an unprivileged bwrap
## tmpfs overlay. Without bwrap those tests SkipTest -- a silent-green gap on the
## trixie-slim container, which does not ship it. The job already runs with
## SYS_ADMIN + apparmor=unconfined, so the namespace is available.
dist-ai-tests:
  helper-scripts: true
  apt-packages: "bubblewrap"
